<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#F7F6F4;--sand:#EDE6DA;--taupe:#C8B0B0;--green:#205447;--petrol:#13434C;
    --wine:#4B1F2D;--graphite:#333333;--muted:#6B6058;--border:rgba(0,0,0,.08);
    --fd:'Cormorant Garamond',Georgia,serif;--fb:'Montserrat','Helvetica Neue',sans-serif;
    --radius:10px;--radius-sm:6px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--petrol)}
  body{font-family:var(--fb);background:var(--petrol);color:var(--graphite);min-height:100vh;min-height:100dvh}

  .tf-progress{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.15);z-index:10}
  .tf-progress-bar{height:100%;background:var(--white);transition:width .35s var(--ease,ease)}

  /* margin:auto centraliza quando cabe na tela e começa do topo (com scroll) quando o conteúdo é maior */
  .tf-stage{min-height:100vh;min-height:100dvh;display:flex;padding:2.5rem 1.5rem}
  .tf-card{max-width:600px;width:100%;margin:auto;color:var(--white);animation:tfIn .35s ease}
  @keyframes tfIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  .tf-counter{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:1rem}
  .tf-desc{font-size:.92rem;color:rgba(255,255,255,.7);margin-bottom:1.2rem;line-height:1.6}
  .tf-question{font-family:var(--fd);font-weight:500;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.35;margin-bottom:.4rem}
  .tf-optional{font-family:var(--fb);font-size:.7rem;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.05em;vertical-align:middle;margin-left:.4rem}

  .tf-answer{margin-top:1.8rem}
  .tf-answer input[type=text],.tf-answer input[type=tel],.tf-answer input[type=email],.tf-answer textarea{
    width:100%;padding:.9rem 0;border:0;border-bottom:2px solid rgba(255,255,255,.35);background:transparent;
    color:var(--white);outline:none;font-family:var(--fb);font-size:1.15rem;transition:border-color .25s
  }
  .tf-answer input::placeholder,.tf-answer textarea::placeholder{color:rgba(255,255,255,.35)}
  .tf-answer input:focus,.tf-answer textarea:focus{border-color:var(--white)}
  .tf-answer textarea{resize:vertical;min-height:90px}
  .tf-hint{font-size:.72rem;color:rgba(255,255,255,.4);margin-top:.6rem}

  .tf-choices{display:flex;flex-direction:column;gap:.6rem}
  .tf-choice{display:flex;align-items:center;gap:.8rem;text-align:left;padding:.9rem 1.1rem;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.04);color:var(--white);border-radius:var(--radius-sm);cursor:pointer;transition:all .18s;font-family:var(--fb);font-size:1rem}
  .tf-choice:hover{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.09)}
  .tf-choice.selected{border-color:var(--white);background:rgba(255,255,255,.16)}
  .tf-choice .letter{width:1.7rem;height:1.7rem;border:1px solid rgba(255,255,255,.4);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
  .tf-choice.selected .letter{background:var(--white);color:var(--petrol);border-color:var(--white)}

  /* grade de múltipla escolha */
  .tf-grid-wrap{overflow-x:auto;margin:0 -.2rem;padding:0 .2rem}
  .tf-grid{border-collapse:collapse;width:100%;min-width:max-content}
  .tf-grid th{font-size:.74rem;font-weight:600;color:rgba(255,255,255,.65);text-align:center;padding:.4rem .6rem;letter-spacing:.02em}
  .tf-grid th:first-child{text-align:left}
  .tf-grid td{border-top:1px solid rgba(255,255,255,.14);padding:.2rem .6rem;text-align:center}
  .tf-grid td.rowlabel{text-align:left;font-size:.95rem;padding-right:1.2rem;min-width:8rem}
  .tf-grid label{display:flex;align-items:center;justify-content:center;width:2.6rem;height:2.6rem;margin:0 auto;cursor:pointer}
  .tf-grid input{appearance:none;-webkit-appearance:none;width:1.25rem;height:1.25rem;border:2px solid rgba(255,255,255,.5);border-radius:50%;margin:0;cursor:pointer;transition:all .15s}
  .tf-grid input:hover{border-color:var(--white)}
  .tf-grid input:checked{border-color:var(--white);background:radial-gradient(var(--white) 0 45%,transparent 50%)}
  .tf-grid input:focus-visible,.tf-check input:focus-visible,.tf-file-btn:focus-visible{outline:2px solid var(--white);outline-offset:3px}

  /* upload de arquivo */
  .tf-file-drop{border:1.5px dashed rgba(255,255,255,.4);border-radius:var(--radius);padding:1.6rem 1.2rem;text-align:center;transition:all .18s}
  .tf-file-drop.over{border-color:var(--white);background:rgba(255,255,255,.08)}
  .tf-file-btn{background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--white);padding:.7rem 1.3rem;border-radius:var(--radius-sm);font-family:var(--fb);font-size:.85rem;font-weight:600;cursor:pointer}
  .tf-file-btn:hover{background:rgba(255,255,255,.1)}
  .tf-file-drop p{font-size:.78rem;color:rgba(255,255,255,.5);margin-top:.8rem}
  .tf-file-chosen{display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid rgba(255,255,255,.35);border-radius:var(--radius-sm);padding:.8rem 1rem;background:rgba(255,255,255,.06)}
  .tf-file-chosen span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
  .tf-file-chosen small{color:rgba(255,255,255,.5);margin-left:.5rem}
  .tf-file-remove{background:0;border:0;color:rgba(255,255,255,.65);font-size:.8rem;font-family:var(--fb);cursor:pointer;flex-shrink:0;text-decoration:underline}

  /* termos e aceite */
  .tf-terms{max-height:min(42vh,22rem);overflow-y:auto;border:1px solid rgba(255,255,255,.28);border-radius:var(--radius-sm);padding:1rem 1.1rem;background:rgba(0,0,0,.14);font-size:.88rem;line-height:1.7;white-space:pre-wrap;color:rgba(255,255,255,.85)}
  .tf-terms-link{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-top:.8rem;padding:1rem 1.1rem;border:1px solid rgba(255,255,255,.35);border-radius:var(--radius-sm);background:rgba(255,255,255,.05);color:var(--white);text-decoration:none;font-weight:600;font-size:.98rem;transition:all .18s}
  .tf-terms-link:first-child{margin-top:0}
  .tf-terms-link:hover{border-color:var(--white);background:rgba(255,255,255,.12)}
  .tf-terms-link small{font-weight:400;font-size:.72rem;color:rgba(255,255,255,.55)}
  .tf-terms-link:focus-visible{outline:2px solid var(--white);outline-offset:3px}
  .tf-check{display:flex;align-items:flex-start;gap:.8rem;margin-top:1.1rem;cursor:pointer;font-size:.95rem;line-height:1.5}
  .tf-check input{appearance:none;-webkit-appearance:none;width:1.4rem;height:1.4rem;border:2px solid rgba(255,255,255,.55);border-radius:4px;flex-shrink:0;margin:.05rem 0 0;cursor:pointer;display:grid;place-items:center;transition:all .15s}
  .tf-check input:checked{background:var(--white);border-color:var(--white)}
  .tf-check input:checked::after{content:"";width:.7rem;height:.38rem;border-left:2.5px solid var(--petrol);border-bottom:2.5px solid var(--petrol);transform:rotate(-45deg) translate(1px,-1px)}

  .tf-nps-scale{display:flex;gap:.4rem;flex-wrap:wrap}
  .tf-nps-btn{width:2.9rem;height:2.9rem;border:1px solid rgba(255,255,255,.35);background:transparent;border-radius:var(--radius-sm);font-family:var(--fb);font-size:.95rem;font-weight:600;color:var(--white);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center}
  .tf-nps-btn:hover{border-color:rgba(255,255,255,.8)}
  .tf-nps-btn.selected{background:var(--white);border-color:var(--white);color:var(--petrol)}
  .tf-nps-labels{display:flex;justify-content:space-between;font-size:.7rem;color:rgba(255,255,255,.5);margin-top:.6rem}

  .tf-actions{display:flex;justify-content:space-between;align-items:center;margin-top:2.2rem}
  .tf-back{background:0;border:0;color:rgba(255,255,255,.55);font-size:.82rem;font-family:var(--fb);cursor:pointer;padding:.5rem 0}
  .tf-back:hover{color:var(--white)}
  .tf-next{background:var(--white);color:var(--petrol);border:0;padding:.75rem 1.6rem;font-size:.82rem;font-weight:700;letter-spacing:.03em;border-radius:var(--radius-sm);cursor:pointer;transition:transform .15s,opacity .15s}
  .tf-next:hover{transform:translateY(-1px)}
  .tf-next:disabled{opacity:.4;cursor:default;transform:none}

  .tf-error{color:#ff9b9b;font-size:.82rem;margin-top:.9rem;display:none}
  .tf-error.show{display:block}

  .tf-thanks .icon{font-size:2.6rem;margin-bottom:1rem}
  .tf-thanks p{color:rgba(255,255,255,.7);font-size:.95rem;margin-top:.4rem}

  .tf-welcome .tf-eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:1rem}
  .tf-welcome h1{font-family:var(--fd);font-weight:500;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.3;margin-bottom:1rem}
  .tf-welcome p{color:rgba(255,255,255,.72);font-size:1rem;line-height:1.7;margin-bottom:2.2rem;white-space:pre-line}
  .tf-start{background:var(--white);color:var(--petrol);border:0;padding:.9rem 2rem;font-size:.85rem;font-weight:700;letter-spacing:.03em;border-radius:var(--radius-sm);cursor:pointer;transition:transform .15s}
  .tf-start:hover{transform:translateY(-1px)}
  .tf-start-hint{display:block;margin-top:1rem;font-size:.72rem;color:rgba(255,255,255,.4)}

  .tf-final-check{width:3rem;height:3rem;border:1.5px solid rgba(255,255,255,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:1.6rem}
  .tf-final h1{font-family:var(--fd);font-weight:500;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.3;margin-bottom:1.2rem}
  .tf-final p{color:rgba(255,255,255,.78);font-size:1rem;line-height:1.75;margin-bottom:2rem;white-space:pre-line}
  .tf-final-btn{display:inline-block;text-decoration:none}

  /* página única: todas as perguntas de uma vez */
  .pg-wrap{max-width:680px;margin:0 auto;padding:3.2rem 1.5rem 4.5rem;color:var(--white)}
  .pg-head{margin-bottom:1.2rem}
  .pg-head .tf-eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:1rem}
  .pg-head h1{font-family:var(--fd);font-weight:500;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.3;margin-bottom:1rem}
  .pg-desc{color:rgba(255,255,255,.75);font-size:1rem;line-height:1.7;white-space:pre-line}
  .pg-q{padding:2rem 0;border-top:1px solid rgba(255,255,255,.14)}
  .pg-label{font-family:var(--fd);font-weight:500;font-size:1.3rem;line-height:1.4;display:flex;gap:.8rem;align-items:baseline}
  .pg-n{font-family:var(--fb);font-size:.78rem;font-weight:600;color:rgba(255,255,255,.45);min-width:1.6rem}
  .pg-req{color:#ffb4b4}
  .pg-q .tf-answer{margin-top:1.1rem}
  .pg-q .tf-hint{display:none}
  .pg-q .tf-error{margin-top:.8rem}
  .pg-actions{border-top:1px solid rgba(255,255,255,.14);padding-top:2rem}
  .pg-submit{padding:.95rem 2.2rem;font-size:.88rem}

  .loading,.notfound{color:var(--white);text-align:center;font-size:.9rem;min-height:100vh;display:flex;align-items:center;justify-content:center}

  @media(max-width:520px){
    .tf-nps-btn{width:2.4rem;height:2.4rem;font-size:.85rem}
  }
</style>
</head>
<body>
  <div id="root" class="loading">Carregando…</div>

<script>
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let form = null;
let currentIndex = 0;
let answers = {};
let slug = '';

const MAX_FILE_BYTES = 3 * 1024 * 1024;
const ALLOWED_FILE_TYPES = ['image/jpeg','image/png','image/webp','application/pdf'];

function isAnswered(f){
  const v = answers[f.key];
  if(f.type === 'nps') return typeof v === 'number';
  if(f.type === 'terms') return v === true;
  if(f.type === 'file') return !!(v && v.data);
  if(f.type === 'grid'){
    const rows = Array.isArray(f.rows) ? f.rows : [];
    return !!v && rows.length > 0 && rows.every(r => v[r]);
  }
  return v !== undefined && v !== null && String(v).trim() !== '';
}

function fmtSize(bytes){
  return bytes >= 1024*1024 ? (bytes/1024/1024).toFixed(1).replace(/\.0$/, '').replace('.', ',') + ' MB' : Math.max(1, Math.round(bytes/1024)) + ' KB';
}

function totalFileBytes(exceptKey){
  return form.fields.reduce((sum, f) => (f.type === 'file' && f.key !== exceptKey && answers[f.key]) ? sum + answers[f.key].size : sum, 0);
}

function fileControlHTML(f){
  const v = answers[f.key];
  if(v && v.data){
    return `<div class="tf-file-chosen"><span>${escapeHtml(v.name)}<small>${fmtSize(v.size)}</small></span><button type="button" class="tf-file-remove">Remover</button></div>`;
  }
  return `
    <div class="tf-file-drop">
      <button type="button" class="tf-file-btn">Escolher arquivo</button>
      <p>ou arraste até aqui · imagem (JPG, PNG, WebP) ou PDF · até ${fmtSize(MAX_FILE_BYTES)}</p>
      <input type="file" class="tf-file-input" accept="image/jpeg,image/png,image/webp,application/pdf" hidden>
    </div>`;
}

function gridControlHTML(f){
  const rows = Array.isArray(f.rows) ? f.rows : [];
  const cols = Array.isArray(f.columns) ? f.columns : [];
  const cur = answers[f.key] || {};
  return `
    <div class="tf-grid-wrap">
      <table class="tf-grid">
        <thead><tr><th></th>${cols.map(c=>`<th scope="col">${escapeHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.map((r,ri)=>`
            <tr><td class="rowlabel" id="gr${ri}">${escapeHtml(r)}</td>
            ${cols.map((c,ci)=>`<td><label><input type="radio" name="g${ri}" data-row="${ri}" data-col="${ci}" aria-labelledby="gr${ri}" aria-label="${escapeHtml(c)}"${cur[r]===c?' checked':''}></label></td>`).join('')}</tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;
}

function termsControlHTML(f){
  const url = /^https?:\/\//i.test(f.url || '') ? f.url : '';
  return `
    ${f.text ? `<div class="tf-terms" tabindex="0" role="region" aria-label="Texto dos termos">${escapeHtml(f.text)}</div>` : ''}
    ${url ? `<a class="tf-terms-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"><span>Ler os termos completos <span aria-hidden="true">↗</span></span><small>abre em outra aba</small></a>` : ''}
    <label class="tf-check"><input type="checkbox" class="tf-terms-check"${answers[f.key]===true?' checked':''}><span>Li e concordo com os termos${f.text ? ' acima' : ''}</span></label>`;
}

function answerControlHTML(f){
  if(f.type === 'grid') return gridControlHTML(f);
  if(f.type === 'file') return fileControlHTML(f);
  if(f.type === 'terms') return termsControlHTML(f);
  if(f.type === 'nps'){
    return `
      <div class="tf-nps-scale" data-key="${f.key}">
        ${Array.from({length:11},(_,i)=>`<button type="button" class="tf-nps-btn${answers[f.key]===i?' selected':''}" data-val="${i}">${i}</button>`).join('')}
      </div>
      <div class="tf-nps-labels"><span>${escapeHtml(f.lowLabel || 'Pouco provável')}</span><span>${escapeHtml(f.highLabel || 'Muito provável')}</span></div>
    `;
  }
  if(f.type === 'select'){
    const opts = Array.isArray(f.options) ? f.options : [];
    const letters = 'ABCDEFGHIJ';
    return `
      <div class="tf-choices" data-key="${f.key}">
        ${opts.map((o,i)=>`<button type="button" class="tf-choice${answers[f.key]===o?' selected':''}" data-val="${escapeHtml(o)}"><span class="letter">${letters[i]||i+1}</span>${escapeHtml(o)}</button>`).join('')}
      </div>
    `;
  }
  if(f.type === 'textarea'){
    return `<textarea class="tf-text" placeholder="Digite sua resposta...">${escapeHtml(answers[f.key]||'')}</textarea><p class="tf-hint">Shift + Enter para pular linha</p>`;
  }
  const inputType = f.type === 'tel' ? 'tel' : (f.type === 'email' ? 'email' : 'text');
  return `<input class="tf-text" type="${inputType}" placeholder="Digite sua resposta..." value="${escapeHtml(answers[f.key]||'')}"><p class="tf-hint">Pressione Enter ↵</p>`;
}

function renderWelcome(){
  const root = document.getElementById('root');
  root.className = '';
  window.scrollTo(0, 0);
  root.innerHTML = `
    <div class="tf-stage"><div class="tf-card tf-welcome">
      <p class="tf-eyebrow">Formulário</p>
      <h1>${escapeHtml(form.title)}</h1>
      ${form.description ? `<p>${escapeHtml(form.description)}</p>` : ''}
      <button type="button" class="tf-start" id="tfStart">Começar →</button>
      <span class="tf-start-hint">${form.fields.length} pergunta${form.fields.length===1?'':'s'} · leva só um minuto</span>
    </div></div>
  `;
  document.getElementById('tfStart').addEventListener('click', ()=> renderStep());
}

function renderStep(){
  const f = form.fields[currentIndex];
  const isLast = currentIndex === form.fields.length - 1;
  const pct = Math.round((currentIndex/form.fields.length)*100);
  const root = document.getElementById('root');
  root.className = '';
  window.scrollTo(0, 0);
  root.innerHTML = `
    <div class="tf-progress"><div class="tf-progress-bar" style="width:${pct}%"></div></div>
    <div class="tf-stage"><div class="tf-card">
      <div class="tf-counter">${currentIndex+1} de ${form.fields.length}</div>
      <h1 class="tf-question">${escapeHtml(f.label)}${f.required?'':'<span class="tf-optional">Opcional</span>'}</h1>
      <div class="tf-answer">${answerControlHTML(f)}</div>
      <p class="tf-error" id="tfError"></p>
      <div class="tf-actions">
        ${currentIndex>0 ? `<button type="button" class="tf-back" id="tfBack">← Voltar</button>` : `<span></span>`}
        <button type="button" class="tf-next" id="tfNext">${isLast ? 'Enviar' : 'OK'}</button>
      </div>
    </div></div>
  `;
  wireStep(f, isLast);
}

function showError(msg, el){
  el = el || document.getElementById('tfError');
  el.textContent = msg;
  el.classList.add('show');
}

// o aviso de erro de cada pergunta fica logo depois da área de resposta
function errorOf(root){ return root.parentElement.querySelector('.tf-error'); }

const REQUIRED_MSG = {
  terms: 'Para continuar, marque que leu e concorda com os termos',
  file: 'Envie um arquivo para continuar',
  grid: 'Responda todas as linhas para continuar',
};

const REQUIRED_MSG_PAGE = {
  terms: 'Marque que leu e concorda com os termos',
  file: 'Envie um arquivo',
  grid: 'Responda todas as linhas',
};

function goNext(f, isLast){
  if(f.required && !isAnswered(f)){
    showError(REQUIRED_MSG[f.type] || 'Essa pergunta é obrigatória');
    return;
  }
  if(isLast){ submitForm(); return; }
  currentIndex++;
  renderStep();
}

// Fotos de celular têm milhões de pixels a mais do que qualquer impressão pede.
// Reduz só o excesso (lado maior até 2000 px, JPG de alta qualidade): numa
// polaroid de ~8 cm isso ainda dá mais de 600 dpi, o dobro dos 300 dpi de gráfica.
const PHOTO_MAX_SIDE = 2000;
const PHOTO_TARGET_BYTES = 900 * 1024; // 3 fotos cabem no limite de 3 MB por envio
const PHOTO_ORIGINAL_CAP = 40 * 1024 * 1024;

function compressImage(file){
  return new Promise((resolve)=>{
    if(file.type === 'application/pdf') return resolve(file);
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      const scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      if(scale === 1 && file.size <= PHOTO_TARGET_BYTES) return resolve(file);
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // PNG com transparência vira fundo branco
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      let q = 0.9;
      const attempt = ()=> canvas.toBlob((blob)=>{
        if(!blob) return resolve(file);
        if(blob.size > PHOTO_TARGET_BYTES && q > 0.66){ q -= 0.05; return attempt(); }
        if(scale === 1 && blob.size >= file.size) return resolve(file);
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', {type:'image/jpeg'}));
      }, 'image/jpeg', q);
      attempt();
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function readFileAsAnswer(f, original, root, hooks){
  const err = errorOf(root);
  if(!ALLOWED_FILE_TYPES.includes(original.type)){
    showError('Formato não aceito. Envie uma imagem (JPG, PNG, WebP) ou um PDF.', err);
    return;
  }
  if(original.size > PHOTO_ORIGINAL_CAP){
    showError('O arquivo tem ' + fmtSize(original.size) + ' e é grande demais. O limite é ' + fmtSize(PHOTO_ORIGINAL_CAP) + '.', err);
    return;
  }
  const isImage = original.type !== 'application/pdf';
  if(isImage) root.innerHTML = '<div class="tf-file-chosen"><span>Preparando a foto…</span></div>';
  const file = isImage ? await compressImage(original) : original;
  if(isImage && !answers[f.key]){ root.innerHTML = fileControlHTML(f); wireFile(f, root, hooks); }
  if(file.size > MAX_FILE_BYTES){
    showError('O arquivo tem ' + fmtSize(file.size) + '. O limite é ' + fmtSize(MAX_FILE_BYTES) + '.', err);
    return;
  }
  if(totalFileBytes(f.key) + file.size > MAX_FILE_BYTES){
    showError('O total dos arquivos deste formulário não pode passar de ' + fmtSize(MAX_FILE_BYTES) + '.', err);
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    answers[f.key] = {name: file.name, type: file.type, size: file.size, data: String(reader.result)};
    err.classList.remove('show');
    root.innerHTML = fileControlHTML(f);
    wireFile(f, root, hooks);
    if(hooks && hooks.onChange) hooks.onChange();
  };
  reader.onerror = ()=> showError('Não foi possível ler o arquivo. Tente novamente.', err);
  reader.readAsDataURL(file);
}

function wireFile(f, root, hooks){
  const remove = root.querySelector('.tf-file-remove');
  if(remove){
    remove.addEventListener('click', ()=>{
      delete answers[f.key];
      root.innerHTML = fileControlHTML(f);
      wireFile(f, root, hooks);
      if(hooks && hooks.onChange) hooks.onChange();
    });
    return;
  }
  const input = root.querySelector('.tf-file-input');
  const drop = root.querySelector('.tf-file-drop');
  root.querySelector('.tf-file-btn').addEventListener('click', ()=> input.click());
  input.addEventListener('change', ()=>{ if(input.files[0]) readFileAsAnswer(f, input.files[0], root, hooks); });
  ['dragenter','dragover'].forEach(ev=> drop.addEventListener(ev, (e)=>{ e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=> drop.addEventListener(ev, (e)=>{ e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e)=>{ if(e.dataTransfer.files[0]) readFileAsAnswer(f, e.dataTransfer.files[0], root, hooks); });
}

// Liga os eventos de uma pergunta dentro de "root" (a área de resposta). Serve
// tanto para a tela de uma pergunta por vez quanto para a página única.
//   hooks.onChange(): chamado quando a resposta muda
//   hooks.onPick(): chamado ao escolher uma opção (nota/escolha única)
//   hooks.onEnter(): chamado ao apertar Enter em campo de texto
function wireControl(f, root, hooks){
  hooks = hooks || {};
  const changed = ()=>{ if(hooks.onChange) hooks.onChange(); };

  const input = root.querySelector('.tf-text');
  if(input){
    input.addEventListener('input', ()=>{ answers[f.key] = input.value; changed(); });
    if(hooks.onEnter){
      input.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter' && !(f.type === 'textarea' && !e.ctrlKey && !e.metaKey)){
          e.preventDefault();
          hooks.onEnter();
        }
      });
    }
  }

  const npsScale = root.querySelector('.tf-nps-scale');
  if(npsScale){
    npsScale.addEventListener('click', (e)=>{
      const btn = e.target.closest('.tf-nps-btn');
      if(!btn) return;
      answers[f.key] = Number(btn.dataset.val);
      npsScale.querySelectorAll('.tf-nps-btn').forEach(b=>b.classList.toggle('selected', b===btn));
      changed();
      if(hooks.onPick) hooks.onPick();
    });
  }

  const choices = root.querySelector('.tf-choices');
  if(choices){
    choices.addEventListener('click', (e)=>{
      const btn = e.target.closest('.tf-choice');
      if(!btn) return;
      answers[f.key] = btn.dataset.val;
      choices.querySelectorAll('.tf-choice').forEach(b=>b.classList.toggle('selected', b===btn));
      changed();
      if(hooks.onPick) hooks.onPick();
    });
  }

  if(f.type === 'grid'){
    const rows = Array.isArray(f.rows) ? f.rows : [];
    const cols = Array.isArray(f.columns) ? f.columns : [];
    root.querySelectorAll('.tf-grid input[type=radio]').forEach(r=>{
      r.addEventListener('change', ()=>{
        const next = Object.assign({}, answers[f.key] || {});
        next[rows[Number(r.dataset.row)]] = cols[Number(r.dataset.col)];
        answers[f.key] = next;
        changed();
      });
    });
  }

  if(f.type === 'terms'){
    const check = root.querySelector('.tf-terms-check');
    check.addEventListener('change', ()=>{
      answers[f.key] = check.checked;
      changed();
    });
  }

  if(f.type === 'file') wireFile(f, root, hooks);
}

function wireStep(f, isLast){
  const root = document.querySelector('.tf-answer');
  const err = document.getElementById('tfError');
  const input = root.querySelector('.tf-text');
  if(input) input.focus();
  wireControl(f, root, {
    onChange: ()=> err.classList.remove('show'),
    onPick: ()=> setTimeout(()=> goNext(f, isLast), 280),
    onEnter: ()=> goNext(f, isLast),
  });
  document.getElementById('tfNext').addEventListener('click', ()=> goNext(f, isLast));
  const backBtn = document.getElementById('tfBack');
  if(backBtn) backBtn.addEventListener('click', ()=>{ currentIndex--; renderStep(); });
}

// ---- Página única: todas as perguntas de uma vez ----

function answeredCount(){
  return form.fields.filter(f=>isAnswered(f)).length;
}

function updatePageProgress(){
  const bar = document.getElementById('pgBar');
  if(bar) bar.style.width = Math.round(answeredCount() / form.fields.length * 100) + '%';
}

function renderPage(message){
  const root = document.getElementById('root');
  root.className = '';
  window.scrollTo(0, 0);
  root.innerHTML = `
    <div class="tf-progress"><div class="tf-progress-bar" id="pgBar" style="width:0%"></div></div>
    <div class="pg-wrap">
      <header class="pg-head">
        <p class="tf-eyebrow">Formulário</p>
        <h1>${escapeHtml(form.title)}</h1>
        ${form.description ? `<p class="pg-desc">${escapeHtml(form.description)}</p>` : ''}
      </header>
      <div class="pg-list">
        ${form.fields.map((f,i)=>`
          <section class="pg-q" data-i="${i}">
            <h2 class="pg-label"><span class="pg-n">${i+1}</span><span>${escapeHtml(f.label)}${f.required ? '<span class="pg-req" title="Obrigatória"> *</span>' : '<span class="tf-optional">Opcional</span>'}</span></h2>
            <div class="tf-answer">${answerControlHTML(f)}</div>
            <p class="tf-error"></p>
          </section>`).join('')}
      </div>
      <div class="pg-actions">
        <button type="button" class="tf-next pg-submit" id="pgSubmit">Enviar</button>
        <p class="tf-error" id="pgError"></p>
      </div>
    </div>`;
  root.querySelectorAll('.pg-q').forEach(sec=>{
    const f = form.fields[Number(sec.dataset.i)];
    wireControl(f, sec.querySelector('.tf-answer'), {
      onChange: ()=>{ sec.querySelector('.tf-error').classList.remove('show'); updatePageProgress(); },
    });
  });
  document.getElementById('pgSubmit').addEventListener('click', submitPage);
  updatePageProgress();
  if(message) showError(message, document.getElementById('pgError'));
}

function submitPage(){
  const missing = [];
  document.querySelectorAll('.pg-q').forEach(sec=>{
    const f = form.fields[Number(sec.dataset.i)];
    if(f.required && !isAnswered(f)){
      missing.push(sec);
      showError(REQUIRED_MSG_PAGE[f.type] || 'Essa pergunta é obrigatória', sec.querySelector('.tf-error'));
    }
  });
  if(missing.length){
    showError(missing.length === 1 ? 'Falta 1 pergunta obrigatória, marcada acima.' : 'Faltam ' + missing.length + ' perguntas obrigatórias, marcadas acima.', document.getElementById('pgError'));
    missing[0].scrollIntoView({behavior:'smooth', block:'center'});
    const first = missing[0].querySelector('.tf-text');
    if(first) first.focus({preventScroll:true});
    return;
  }
  submitForm();
}

// Página final configurada no CRM (título, mensagem e botão opcional). Sem
// configuração, mostra o agradecimento simples.
function renderFinal(){
  const root = document.getElementById('root');
  const fp = form.final_page || {};
  window.scrollTo(0, 0);
  if(!fp.title && !fp.message){
    root.innerHTML = `
      <div class="tf-stage"><div class="tf-card tf-thanks" style="text-align:center">
        <div class="icon">✓</div>
        <h1 class="tf-question">Obrigado!</h1>
        <p>Sua resposta foi registrada com sucesso.</p>
      </div></div>`;
    return;
  }
  const url = /^https?:\/\//i.test(fp.buttonUrl || '') ? fp.buttonUrl : '';
  root.innerHTML = `
    <div class="tf-stage"><div class="tf-card tf-final">
      <div class="tf-final-check" aria-hidden="true">✓</div>
      ${fp.title ? `<h1>${escapeHtml(fp.title)}</h1>` : ''}
      ${fp.message ? `<p>${escapeHtml(fp.message)}</p>` : ''}
      ${url && fp.buttonLabel ? `<a class="tf-start tf-final-btn" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(fp.buttonLabel)}</a>` : ''}
    </div></div>`;
}

async function submitForm(){
  const root = document.getElementById('root');
  root.innerHTML = `<div class="tf-stage"><div class="tf-card"><p style="color:rgba(255,255,255,.7)">Enviando...</p></div></div>`;
  try{
    const res = await fetch(`/api/forms/public/${encodeURIComponent(slug)}`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({answers})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || 'Erro ao enviar');
    renderFinal();
  }catch(err){
    // na página única volta para o formulário, com as respostas preservadas
    if(form.layout === 'page'){ renderPage(err.message); return; }
    root.innerHTML = `<div class="tf-stage"><div class="tf-card"><p style="color:#ff9b9b">${escapeHtml(err.message)}</p></div></div>`;
  }
}

async function init(){
  const root = document.getElementById('root');
  slug = new URLSearchParams(location.search).get('s') || '';
  if(!slug){
    root.className = 'notfound';
    root.textContent = 'Link inválido.';
    return;
  }
  try{
    const res = await fetch('/api/forms/public/' + encodeURIComponent(slug));
    if(!res.ok) throw new Error('not found');
    form = await res.json();
  }catch(err){
    root.className = 'notfound';
    root.textContent = 'Formulário não encontrado ou expirado.';
    return;
  }
  if(!form.fields || !form.fields.length){
    root.className = 'notfound';
    root.textContent = 'Esse formulário ainda não tem perguntas.';
    return;
  }
  if(form.layout === 'page') renderPage(); else renderWelcome();
}
init();
